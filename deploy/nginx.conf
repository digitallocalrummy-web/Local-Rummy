# /etc/nginx/sites-available/local-rummy
# Serves the admin panel at /admin and proxies the API + live game sockets to the Node server.
# Without a domain, keep `server_name _;` and open http://YOUR_VPS_IP/admin
server {
    listen 80;
    server_name _;

    # Admin panel (built files from apps/admin/dist, built with ADMIN_BASE=/admin/)
    location /admin/ {
        alias /var/www/local-rummy-admin/;
        try_files $uri $uri/ /admin/index.html;
        # Optional extra lock: create with `htpasswd -c /etc/nginx/.lr_admin someone`
        # auth_basic "Local Rummy admin";
        # auth_basic_user_file /etc/nginx/.lr_admin;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live game (Socket.io websockets)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Web prototype (optional)
    location / {
        root /var/www/local-rummy-prototype;
        try_files $uri $uri/ /index.html;
    }
}
